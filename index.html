<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
:root{--cream:#fdf4c6;--ink:#141414;--teal:#0f766e;--teal-l:#ccfbf1;--muted:#6b6b6b;--line:#e8dfb3;--card:#fffdf3}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;padding-bottom:90px}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
.hero{text-align:center;padding:28px 0 18px}
.hero img{width:min(300px,78vw);border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.12);background:var(--cream);display:block;margin:0 auto}
.hero h1{font-size:clamp(24px,5vw,34px);font-weight:800;margin-top:18px}
.hero p{color:var(--muted);font-weight:700;margin-top:6px}
.tabs{display:flex;gap:6px;justify-content:center;flex-wrap:nowrap;margin:18px 0 22px;position:sticky;top:0;padding:10px 0;background:var(--cream);z-index:5}
.tab{border:2px solid var(--ink);background:transparent;color:var(--ink);font:700 14px 'Tajawal';padding:8px 12px;border-radius:999px;cursor:pointer;transition:.2s}
.tab.active{background:var(--ink);color:var(--cream)}
.tab span{opacity:.6;font-weight:500;margin-inline-start:4px}
.grade{display:none}.grade.active{display:block}
.grade h2{font-size:20px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.top{display:flex;gap:12px;align-items:center}
.num{flex:none;width:40px;height:40px;border-radius:12px;background:var(--ink);color:var(--cream);display:grid;place-items:center;font-weight:800}
.title{font-weight:800;font-size:17px;line-height:1.5}
.actions{display:flex;gap:8px}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;font:700 14px 'Tajawal';padding:10px;border-radius:10px;text-decoration:none;cursor:pointer;border:2px solid var(--teal);transition:.15s}
.open{background:var(--teal);color:#fff}.open:hover{filter:brightness(1.1)}
.copy{background:#fff;color:var(--teal)}.copy:hover{background:var(--teal-l)}
.copy.done{background:#16a34a;border-color:#16a34a;color:#fff}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--ink);color:var(--cream);padding:12px 22px;border-radius:12px;font-weight:700;transition:.3s;z-index:20}
.toast.show{transform:translateX(-50%) translateY(0)}
.wa{position:fixed;bottom:20px;right:20px;width:56px;height:56px;border-radius:50%;background:#22c55e;color:#fff;display:grid;place-items:center;font-size:30px;box-shadow:0 6px 16px rgba(0,0,0,.2);border:2px solid #fff;text-decoration:none}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:30px}
</style>
</head>
<body>

"prep3/10/"}]}];
const tabs = document.getElementById('tabs'), main = document.getElementById('grades');
function urlFor(p){ return new URL(p, location.href).href; }
DATA.forEach((g, gi) => {
  const t = document.createElement('button');
  t.className = 'tab' + (gi===0?' active':''); t.dataset.g = g.slug;
  t.innerHTML = `${g.label.replace('الصف ','')}<span>(${g.items.length})</span>`;
  t.onclick = () => show(g.slug);
  tabs.appendChild(t);
  const sec = document.createElement('section');
  sec.className = 'grade' + (gi===0?' active':''); sec.id = g.slug;
  sec.innerHTML = `<h2><i class="fa-solid fa-flask"></i>${g.label}</h2><div class="list"></div>`;
  const list = sec.querySelector('.list');
  g.items.forEach(it => {
    const c = document.createElement('div'); c.className = 'card';
    c.innerHTML = `<div class="top"><div class="num">${it.n}</div><div class="title">${it.t}</div></div>
      <div class="actions"><a class="btn open" href="${it.p}" target="_blank"><i class="fa-solid fa-play"></i> فتح الدرس</a>
      <button class="btn copy"><i class="fa-regular fa-copy"></i> نسخ الرابط</button></div>`;
    c.querySelector('.copy').onclick = e => copyLink(urlFor(it.p), e.currentTarget);
    list.appendChild(c);
  });
  main.appendChild(sec);
});
function show(slug){
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.g===slug));
  document.querySelectorAll('.grade').forEach(x=>x.classList.toggle('active',x.id===slug));
  try{ history.replaceState(null,'','#'+slug); }catch(e){}
}
if (location.hash && document.getElementById(location.hash.slice(1))) show(location.hash.slice(1));
function copyLink(url, btn){
  const ok = () => {
    const old = btn.innerHTML; btn.classList.add('done'); btn.innerHTML = '<i class="fa-solid fa-check"></i> تم النسخ';
    const toast = document.getElementById('toast'); toast.classList.add('show');
    setTimeout(()=>{ btn.classList.remove('done'); btn.innerHTML = old; toast.classList.remove('show'); }, 1600);
  };
  const fallback = () => { const ta=document.createElement('textarea'); ta.value=url; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} ta.remove(); ok(); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(url).then(ok, fallback); else fallback();
}
</script>
